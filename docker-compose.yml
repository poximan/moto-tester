services:
  trasvase-tester:
    pids_limit: 256
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: moto-tester-trasvase-tester:1.0.0
    build:
      context: .
      dockerfile: trasvase-tester/Dockerfile
      additional_contexts:
        frontend-foundation: ../../platform/frontend-foundation
    container_name: moto-tester-trasvase-tester
    environment:
      MODBUS_HOST: ${MODBUS_HOST}
      MODBUS_PORT: ${MODBUS_PORT}
      MODBUS_UNIT_ID: ${MODBUS_UNIT_ID}
      MODBUS_TIMEOUT_S: ${MODBUS_TIMEOUT_S}
      MODBUS_RECONNECT_BACKOFF_S: ${MODBUS_RECONNECT_BACKOFF_S}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS}
      POLL_MAX_STALE_MS: ${POLL_MAX_STALE_MS}
      SIMULATION_MODE: ${SIMULATION_MODE}
      FIELD_EMULATOR_URL: ${FIELD_EMULATOR_URL}
      INTERNAL_EMULATOR_TOKEN: ${INTERNAL_EMULATOR_TOKEN}
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    networks:
      - backend
      - edge

  field-emulator:
    pids_limit: 256
    logging: *default-logging
    image: moto-tester-field-emulator:1.0.0
    build:
      context: .
      dockerfile: field-emulator/Dockerfile
    container_name: moto-tester-field-emulator
    environment:
      TESTER_API_URL: "http://trasvase-tester:8080"
      INTERNAL_EMULATOR_TOKEN: ${INTERNAL_EMULATOR_TOKEN}
      FIELD_EMULATOR_INTERVAL_MS: ${FIELD_EMULATOR_INTERVAL_MS}
      FIELD_EMULATOR_INLET_OPEN_PCT: ${FIELD_EMULATOR_INLET_OPEN_PCT}
      FIELD_EMULATOR_OUTLET_OPEN_PCT: ${FIELD_EMULATOR_OUTLET_OPEN_PCT}
      FIELD_EMULATOR_INLET_RATE_PER_S: ${FIELD_EMULATOR_INLET_RATE_PER_S}
      FIELD_EMULATOR_CONSUMPTION_RATE_PER_S: ${FIELD_EMULATOR_CONSUMPTION_RATE_PER_S}
      FIELD_EMULATOR_PUMP_RATE_PER_S: ${FIELD_EMULATOR_PUMP_RATE_PER_S}
      FIELD_EMULATOR_SEASON_POSITION_PCT: ${FIELD_EMULATOR_SEASON_POSITION_PCT}
      FIELD_EMULATOR_HISTORY_INTERVAL_S: ${FIELD_EMULATOR_HISTORY_INTERVAL_S}
      FIELD_EMULATOR_HISTORY_SIMULATED_DAYS: ${FIELD_EMULATOR_HISTORY_SIMULATED_DAYS}
    depends_on:
      trasvase-tester:
        condition: service_started
    volumes:
      - ./runtime:/runtime
    restart: unless-stopped
    networks:
      - backend

name: moto-tester

networks:
  backend:
    name: moto-tester-backend-net
    driver: bridge
  edge:
    name: servicoop-edge-net
    external: true
