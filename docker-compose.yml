services:
  trasvase-tester:
    image: moto-tester-trasvase-tester:1.0.0
    build:
      context: .
      dockerfile: trasvase-tester/Dockerfile
    container_name: moto-tester-trasvase-tester
    env_file:
      - .env
    ports:
      - "0.0.0.0:${WEB_HOST_PORT}:8080"
    volumes:
      - ./runtime:/app/runtime
    restart: unless-stopped
    networks:
      - default
      - edge

  field-emulator:
    image: moto-tester-field-emulator:1.0.0
    build:
      context: .
      dockerfile: field-emulator/Dockerfile
    container_name: moto-tester-field-emulator
    env_file:
      - .env
    environment:
      TESTER_API_URL: "http://trasvase-tester:8080"
    depends_on:
      trasvase-tester:
        condition: service_healthy
    volumes:
      - ./runtime:/runtime
    restart: unless-stopped

name: moto-tester

networks:
  default:
  edge:
    name: servicoop-edge-net
    external: true
